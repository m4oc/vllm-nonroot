name: Build & Push vLLM Non-Root Image

on:
  push:
    branches:
      - main

  # 🔥 Running every night at 03:00 UTC
  schedule:
    - cron: "0 3 * * *"

  # Allow manual trigger
  workflow_dispatch:

env:
  IMAGE_NAME: vllm-nonroot

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_REF=ghcr.io/${OWNER}/${IMAGE_NAME}" >> "$GITHUB_ENV"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile.nonroot \
            -t "${IMAGE_REF}:latest" \
            -t "${IMAGE_REF}:${GITHUB_SHA}" \
            .

      - name: Push Docker image
        run: |
          docker push "${IMAGE_REF}:latest"
          docker push "${IMAGE_REF}:${GITHUB_SHA}"
